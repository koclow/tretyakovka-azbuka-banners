<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Соберите коллекцию шедевров — мобильный 300×250, женщина</title>
<script>document.documentElement.className = 'js';</script>
<style>
  :root{ --green:#184936; --ease-out:cubic-bezier(.16,1,.3,1); --ease-calm:cubic-bezier(.37,0,.63,1); }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; background:var(--green); overflow:hidden; }
  /* Мобильный по макету «iPhone 16»: фото слева во всю высоту, набор справа.
     На 300 px — ровно файл 300×250 из ТТ; шире — тянется по слоту, фото и набор подрастают. */
  .cr{ position:relative; width:100%; min-width:300px; height:250px; background:var(--green); overflow:hidden;
       container-type:inline-size;
       --pw:clamp(120px, 43cqw, 170px);          /* ширина фото: 129 на 300, 161 на 375, 170 от 395 */
       --g:clamp(0px, calc(100cqw - 300px), 75px); /* «насколько мы шире 300» — набор растёт до 375 */
       cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent; }
  .photo{ position:absolute; left:0; top:0; bottom:0; width:var(--pw); overflow:hidden; transform-origin:50% 50%; }
  .photo img{ display:block; width:100%; height:100%; object-fit:cover; object-position:50% 50%; }
  .col{ position:absolute; left:calc(var(--pw) + 17px); top:0; bottom:0; right:0; }
  .lay{ position:absolute; }
  .lay > img{ display:block; width:100%; height:auto; }
  /* макет 393×359 → 250 в высоту: плашка 169×22.75 (187,21), заголовок 171×94 (188.1,57.5),
     логотип 125×38.9 у нижнего края с полем 21. На 300 набор в масштабе 0.85. */
  .badge   { left:0;     top:21px;    width:calc(143px + var(--g) * .3467); }
  .headline{ left:1.1px; top:57.5px;  width:calc(145px + var(--g) * .3467); aspect-ratio:171 / 94; }
  .logo    { left:0;     bottom:21px; width:calc(106px + var(--g) * .2533); }
  .w{ position:absolute; left:0; top:0; width:100%; transform-origin:0 50%; }
  .w img{ display:block; width:100%; height:auto; }

  /* до старта слои спрятаны: никакой вспышки готового кадра перед появлением */
  .js .cr:not(.play):not(.static) > *{ opacity:0; }

  /* ——— появление: фото проявляется, плашка и слова въезжают слева с мягким «смазом», логотип следом ——— */
  .play .photo   { animation:photoIn 1.5s var(--ease-out) 0s    both; }
  .play .badge   { animation:smearIn 1.0s var(--ease-out) .35s  both; }
  .play .w1      { animation:smearIn 1.1s var(--ease-out) .50s  both; }
  .play .w2      { animation:smearIn 1.1s var(--ease-out) .64s  both; }
  .play .w3      { animation:smearIn 1.1s var(--ease-out) .78s  both; }
  .play .logo    { animation:smearIn 1.0s var(--ease-out) 1.15s both; }
  @keyframes photoIn{ from{ opacity:0; transform:scale(1.02); } to{ opacity:1; transform:none; } }
  @keyframes smearIn{ from{ opacity:0; transform:translateX(-8px) scaleX(1.03); filter:blur(3px); }
                      to  { opacity:1; transform:none; filter:blur(0); } }
  .done .lay, .done .w, .done .photo{ animation:none; opacity:1; transform:none; filter:none; }
  /* ——— покой: медленный наезд на фото ——— */
  .photo img{ animation:kenburns 20s var(--ease-calm) 0s infinite alternate; transform-origin:50% 45%; }
  @keyframes kenburns{ from{ transform:scale(1.07); } to{ transform:scale(1); } }

  @media (prefers-reduced-motion:reduce){
    .play .lay, .play .w, .play .photo, .photo img{
      animation:none !important; transform:none !important; opacity:1 !important; filter:none !important; }
    .play{ animation:softIn .4s ease both; }
    @keyframes softIn{ from{ opacity:0; } to{ opacity:1; } }
  }
  .lnk{ position:absolute; left:0; top:0; right:0; bottom:0; z-index:9; display:block; }
</style>
</head>

<script>
  var c = document.getElementById('cr'), started = false, q = location.search, doneT;
  function start(){
    if (started) return; started = true;
    c.classList.remove('done'); c.classList.add('play');
    doneT = setTimeout(function(){ c.classList.add('done'); }, 3000);
  }
  function go(){
    if (!document.hidden) return start();
    document.addEventListener('visibilitychange', function h(){
      if (!document.hidden){ document.removeEventListener('visibilitychange', h); start(); }
    });
  }
  var at = /[?&]at=(\d+)/.exec(q);
  if (at){
    start(); clearTimeout(doneT); void c.offsetWidth;
    document.getAnimations().forEach(function(a){ a.pause(); a.currentTime = +at[1]; });
  }
  else if (/[?&]static/.test(q)){ c.classList.add('static'); started = true; }
  else {
    if (document.readyState === 'complete') go(); else window.addEventListener('load', go);
    setTimeout(go, 2500);
  }
  // Клик: в сети РБК макрос %banner.reference_mrc_user1% заменён на ссылку — уходим по ней.
  // Пока макрос не подставлен (демо, локальный просмотр) — клик проигрывает заново.
  var lnk = document.getElementById('lnk');
  if (lnk.getAttribute('href').charAt(0) === '%') lnk.addEventListener('click', function(e){
    e.preventDefault(); clearTimeout(doneT); started = false;
    c.classList.remove('play', 'done'); void c.offsetWidth; start();
  });
</script>
