<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Соберите коллекцию шедевров — мобильный 100%×250, мужчина</title>
<style>
  :root{ --green:#184936; --ease-out:cubic-bezier(.16,1,.3,1); --ease-calm:cubic-bezier(.37,0,.63,1); }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; background:var(--green); overflow:hidden; }
  .banner{ position:relative; width:100%; height:250px; background:var(--green); overflow:hidden;
           cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent; }
  /* Макет «4»: фото сверху 125 px во всю ширину, снизу зелёная панель с набором.
     Набор — блок 300 px по центру, как в макете; на 320 px он чуть заходит за края. */
  .photo{ position:absolute; left:0; top:0; width:100%; height:125px; overflow:hidden; }
  .photo img{ display:block; width:100%; height:100%; object-fit:cover; object-position:50% 40%; }
  .box{ position:absolute; left:50%; top:125px; width:300px; height:125px; transform:translateX(-50%); }
  .lay{ position:absolute; }
  .lay > img{ display:block; width:100%; height:auto; }
  .headline{ left:18px; top:16px; width:248px; }
  .lockup  { left:18px; top:84px; width:264px; }

  .play .photo   { animation:photoIn 1.6s var(--ease-out) 0s both; }
  .play .headline{ animation:wipeIn  1.4s var(--ease-out) .40s both; }
  .play .lockup  { animation:riseIn  1.0s var(--ease-out) 1.15s both; }
  @keyframes photoIn{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes riseIn { from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }
  @keyframes wipeIn { from{ opacity:0; clip-path:inset(0 100% 0 0); transform:translateY(6px); }
                      to  { opacity:1; clip-path:inset(0 0 0 0);    transform:none; } }
  .photo img{ animation:kenburns 20s var(--ease-calm) 0s infinite alternate; transform-origin:50% 40%; }
  @keyframes kenburns{ from{ transform:scale(1.07); } to{ transform:scale(1); } }

  @media (prefers-reduced-motion:reduce){
    .play .lay, .play .photo, .photo img{ animation:none !important; transform:none !important; opacity:1 !important; clip-path:none !important; }
    .play{ animation:softIn .4s ease both; }
    @keyframes softIn{ from{ opacity:0; } to{ opacity:1; } }
  }
</style>
</head>

<script>
  var b = document.getElementById('banner'), started = false;
  function start(){ if (started) return; started = true; b.classList.add('play'); }
  // ?static — финальный кадр без появления: для скриншотов и заглушки
  if (/[?&]static/.test(location.search)){ started = true; }
  else if ('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(e){ if (e[0].isIntersecting){ start(); io.disconnect(); } }, { threshold:.5 });
    io.observe(b);
    document.addEventListener('visibilitychange', function(){ if (!document.hidden) start(); });
    setTimeout(start, 1500);
  } else { start(); }
  b.addEventListener('click', function(){ b.classList.remove('play'); void b.offsetWidth; b.classList.add('play'); });
