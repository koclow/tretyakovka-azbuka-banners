<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Соберите коллекцию шедевров — билборд 100%×250, фото</title>
<style>
  :root{
    --green:#184936;
    --ease-out:cubic-bezier(.16,1,.3,1);
    --ease-calm:cubic-bezier(.37,0,.63,1);
    --d:calc(100% - 680px);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; background:var(--green); overflow:hidden; }
  .banner{ position:relative; width:100%; height:250px; background:var(--green); overflow:hidden;
           cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent; }
  .box{ position:absolute; left:0; right:0; top:0; height:100%; margin:0 auto; max-width:1440px; }
  .lay{ position:absolute; }
  .lay > img{ display:block; width:100%; height:auto; }

  /* Макет «вар 1»: зелёная панель 58,3 % ширины, фото — остальное.
     Набор между 680 и 1440 растёт линейно. */
  .headline{ left:calc(30px + var(--d) * .02895); top:calc(42px - var(--d) * .00395); width:calc(298px + var(--d) * .26118); }
  .lockup  { left:calc(30px + var(--d) * .02632); top:178px;                            width:calc(217px + var(--d) * .19079); }
  .photo{ position:absolute; top:0; bottom:0; right:0; left:58.333%; overflow:hidden; }
  .photo img{ display:block; width:100%; height:100%; object-fit:cover; object-position:45% 50%; }

  @media (max-width:679.98px){
    .photo{ display:none; }
    .box{ left:50%; right:auto; transform:translateX(-50%); width:300px; }
    .headline{ left:24px; top:74px; width:252px; }
    .lockup  { left:24px; top:174px; width:220px; }
  }

  /* ——— появление ——— */
  .play .photo   { animation:photoIn 1.8s var(--ease-out) 0s both; }
  .play .headline{ animation:wipeIn  1.5s var(--ease-out) .45s both; }
  .play .lockup  { animation:riseIn  1.1s var(--ease-out) 1.25s both; }
  @keyframes photoIn{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes riseIn { from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:none; } }
  @keyframes wipeIn { from{ opacity:0; clip-path:inset(0 100% 0 0); transform:translateY(8px); }
                      to  { opacity:1; clip-path:inset(0 0 0 0);    transform:none; } }
  /* ——— покой: медленный наезд на коробку ——— */
  .photo img{ animation:kenburns 22s var(--ease-calm) 0s infinite alternate; transform-origin:55% 50%; }
  @keyframes kenburns{ from{ transform:scale(1.06); } to{ transform:scale(1); } }

  @media (prefers-reduced-motion:reduce){
    .play .lay, .play .photo, .photo img{ animation:none !important; transform:none !important; opacity:1 !important; clip-path:none !important; }
    .play{ animation:softIn .4s ease both; }
    @keyframes softIn{ from{ opacity:0; } to{ opacity:1; } }
  }
</style>
</head>

<script>
  var b = document.getElementById('banner'), started = false;
  function start(){ if (started) return; started = true; b.classList.add('play'); }
  if ('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(e){ if (e[0].isIntersecting){ start(); io.disconnect(); } }, { threshold:.5 });
    io.observe(b);
    document.addEventListener('visibilitychange', function(){ if (!document.hidden) start(); });
    setTimeout(start, 1500);
  } else { start(); }
  b.addEventListener('click', function(){ b.classList.remove('play'); void b.offsetWidth; b.classList.add('play'); });
</script>
