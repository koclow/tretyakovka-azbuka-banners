<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Соберите коллекцию шедевров — перетяжка 100%×250, иллюстрация</title>
<script>document.documentElement.className = 'js';</script>
<style>
  :root{
    --green:#184936;
    --ease-out:cubic-bezier(.16,1,.3,1);      /* быстрый старт, долгое мягкое доезжание */
    --ease-calm:cubic-bezier(.37,0,.63,1);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; background:var(--green); overflow:hidden; }
  .cr{ position:relative; width:100%; height:250px; background:var(--green); overflow:hidden;
       cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent; }
  .box{ position:absolute; left:0; right:0; top:0; height:100%; margin:0 auto; max-width:1440px;
        container-type:inline-size;
        --d:calc(100cqw - 680px); }   /* «сколько мы шире минимума» — ширина коробки, не высота */
  .lay{ position:absolute; }
  .lay > img{ display:block; width:100%; height:auto; }

  /* Два опорных макета: 680×250 (минимум и заглушка) и 1440×250 («вар 2»).
     Между ними всё линейно: left = L680 + (ширина − 680) · k. */
  .badge   { left:calc(23px + var(--d) * .02237); top:calc(30px - var(--d) * .00526); width:216px; }
  .headline{ left:calc(24px + var(--d) * .02329); top:calc(60px + var(--d) * .01632); width:272px;
             aspect-ratio:496.488 / 97.544; }
  .logo-st { left:calc(23px + var(--d) * .02237); top:calc(180px + var(--d) * .01316); width:123px; }
  .logo-ln { left:calc(23px + var(--d) * .02237); top:calc(180px + var(--d) * .01868); width:210.3px; height:31.5px; display:none; }
  .logo-ln .mark{ position:absolute; left:0; top:0; width:38.1px; }
  .logo-ln .word{ position:absolute; left:48.9px; top:3.2px; width:161.4px; }
  .logo-ln img{ display:block; width:100%; height:auto; }

  .horse { left:calc(247px + var(--d) * .51447);     top:calc(100.667px - var(--d) * .10351); width:calc(203.333px + var(--d) * .17561); }
  .disc  { left:calc(400px + var(--d) * .75658);     top:calc(0px - var(--d) * .07895);       width:calc(183px + var(--d) * .10961);
           transform-origin:50% 38.2%; }
  .couple{ left:calc(576.333px + var(--d) * .9114);  top:calc(64px - var(--d) * .06316);      width:calc(96px + var(--d) * .06); }

  /* заголовок — три слова в одной коробке, каждое своим слоем (общий viewBox) */
  .w{ position:absolute; left:0; top:0; width:100%; transform-origin:0 50%; }
  .w img{ display:block; width:100%; height:auto; }

  /* заголовок растёт только после 960 px — иначе к 800 px упирается в голову коня */
  @media (min-width:960px){ .headline{ width:calc(272px + (100cqw - 960px) * .37563); } }
  /* логотип: до 900 px — макетный, в две строки; дальше — в строку, как в макете 1440 */
  @media (min-width:900px){ .logo-st{ display:none; } .logo-ln{ display:block; } }

  /* ——— слот чуть уже 680 (у РБК гуттеры съедают 16 px): макет 680 по центру, края подрезаются ——— */
  .m{ display:none; }
  @media (max-width:679.98px){
    .box{ left:50%; right:auto; transform:translateX(-50%); width:680px; }
  }
  /* ——— совсем узкий (< 600): только набор, по центру ——— */
  @media (max-width:599.98px){
    .wide{ display:none; }
    .m{ display:block; }
    .box{ width:300px; }
    .m.headline{ left:24px; top:74px; width:252px; }
    .m.logo-st { left:24px; top:174px; width:123px; }
  }

  /* ——— до старта слои спрятаны: никакой вспышки готового кадра перед появлением ——— */
  .js .cr:not(.play):not(.static) > *{ opacity:0; }

  /* ——— появление, как в фирменном ролике: иллюстрация поднимается снизу,
         текст и логотип въезжают слева с мягким «смазом» — слово за словом ——— */
  .play .horse   { animation:riseUp  1.6s var(--ease-out) 0s    both; }
  .play .disc    { animation:discIn  1.7s var(--ease-out) .12s  both; }
  .play .couple  { animation:riseUp  1.5s var(--ease-out) .26s  both; }
  .play .badge   { animation:smearIn 1.1s var(--ease-out) .50s  both; }
  .play .w1      { animation:smearIn 1.2s var(--ease-out) .70s  both; }
  .play .w2      { animation:smearIn 1.2s var(--ease-out) .86s  both; }
  .play .w3      { animation:smearIn 1.2s var(--ease-out) 1.02s both; }
  .play .logo-st { animation:smearIn 1.1s var(--ease-out) 1.40s both; }
  .play .logo-ln .mark{ animation:smearIn 1.0s var(--ease-out) 1.40s both; }
  .play .logo-ln .word{ animation:smearIn 1.0s var(--ease-out) 1.52s both; }

  @keyframes riseUp { from{ opacity:0; transform:translateY(18px); } to{ opacity:1; transform:none; } }
  @keyframes discIn { from{ opacity:0; transform:translateY(14px) scale(.98); } to{ opacity:1; transform:none; } }
  @keyframes smearIn{ from{ opacity:0; transform:translateX(-10px) scaleX(1.03); filter:blur(4px); }
                      to  { opacity:1; transform:none; filter:blur(0); } }

  /* ——— после появления — чистое финальное состояние, что бы ни случилось с таймлайном ——— */
  .done .lay, .done .w, .done .mark, .done .word{ animation:none; opacity:1; transform:none; filter:none; }

  /* ——— покой: едва заметно и очень медленно ——— */
  .horse  img{ animation:floatY  9s  var(--ease-calm) 2.8s infinite alternate; }
  .disc   img{ animation:breathe 11s var(--ease-calm) 2.8s infinite alternate; transform-origin:50% 38.2%; }
  .couple img{ animation:sway    12s var(--ease-calm) 3.1s infinite alternate; transform-origin:50% 100%; }
  @keyframes floatY { from{ transform:translateY(0); }   to{ transform:translateY(-1.4%); } }
  @keyframes breathe{ from{ transform:scale(1); }        to{ transform:scale(1.03); } }
  @keyframes sway   { from{ transform:rotate(-.4deg); }  to{ transform:rotate(.4deg); } }

  @media (prefers-reduced-motion:reduce){
    .play .lay, .play .w, .play .mark, .play .word, .lay img{
      animation:none !important; transform:none !important; opacity:1 !important; filter:none !important; }
    .play{ animation:softIn .4s ease both; }
    @keyframes softIn{ from{ opacity:0; } to{ opacity:1; } }
  }
  .lnk{ position:absolute; left:0; top:0; right:0; bottom:0; z-index:9; display:block; }
</style>
</head>

<script>
  var c = document.getElementById('cr'), started = false, q = location.search, doneT;
  function start(){
    if (started) return; started = true;
    c.classList.remove('done'); c.classList.add('play');
    doneT = setTimeout(function(){ c.classList.add('done'); }, 3400);
  }
  // Старт — когда всё загружено и вкладка видна: в скрытой вкладке таймлайн стоит,
  // и слои застряли бы невидимыми; ждём возвращения.
  function go(){
    if (!document.hidden) return start();
    document.addEventListener('visibilitychange', function h(){
      if (!document.hidden){ document.removeEventListener('visibilitychange', h); start(); }
    });
  }
  var at = /[?&]at=(\d+)/.exec(q);
  if (at){
    // ?at=1200 — стоп-кадр на заданной миллисекунде: для раскадровки и проверки
    start(); clearTimeout(doneT); void c.offsetWidth;
    document.getAnimations().forEach(function(a){ a.pause(); a.currentTime = +at[1]; });
  }
  else if (/[?&]static/.test(q)){ c.classList.add('static'); started = true; }   // финальный кадр: скриншоты, заглушка
  else {
    if (document.readyState === 'complete') go(); else window.addEventListener('load', go);
    setTimeout(go, 2500);   // страховка: если какая-то картинка зависла, не ждём её вечно
  }
  // Клик: в сети РБК макрос %banner.reference_mrc_user1% заменён на ссылку — уходим по ней.
  // Пока макрос не подставлен (демо, локальный просмотр) — клик проигрывает заново.
  var lnk = document.getElementById('lnk');
  if (lnk.getAttribute('href').charAt(0) === '%') lnk.addEventListener('click', function(e){
    e.preventDefault(); clearTimeout(doneT); started = false;
    c.classList.remove('play', 'done'); void c.offsetWidth; start();
  });
</script>
