<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Соберите коллекцию шедевров — 300×250</title>
<style>
  :root{
    --green:#184936;
    --ease-out:cubic-bezier(.23,1,.32,1);
    --ease-calm:cubic-bezier(.37,0,.63,1);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; background:var(--green); overflow:hidden; }

  .banner{
    position:relative; width:100%; aspect-ratio:300/250;
    background:var(--green); overflow:hidden;
    cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent;
  }
  .stack{ position:absolute; inset:0; transform-origin:50% 45%; }
  .lay{ position:absolute; }
  .lay > img{ display:block; width:100%; height:100%; }

  /* ——— геометрия: проценты = точная копия макета 300×250 ——— */
  .l1   { left:9.4443%; top:12.6668%; width:71%;      height:17.3332%; }
  .l2   { left:9.889%;  top:31.6%;    width:77.5557%; height:12%; }
  .l3   { left:9.889%;  top:46.8%;    width:71.111%;  height:13.6%; }
  .logo { left:9%;      top:73.6%;    width:73.5557%; height:13.6%; }

  /* ——— появление: строки поднимаются с шагом 70 мс, всё на месте к 1.0 с ——— */
  .play .l1  { animation:riseIn .58s var(--ease-out) .12s both; }
  .play .l2  { animation:riseIn .58s var(--ease-out) .19s both; }
  .play .l3  { animation:riseIn .58s var(--ease-out) .26s both; }
  .play .logo{ animation:riseIn .60s var(--ease-out) .42s both; }

  @keyframes riseIn{ from{ opacity:0; transform:translateY(42%); } to{ opacity:1; transform:none; } }

  /* ——— покой: очень медленный наезд на весь кадр.
         Набор не дёргается построчно — двигается композиция целиком. ——— */
  .play .stack{ animation:slowZoom 14s var(--ease-calm) 1.4s infinite alternate; }
  @keyframes slowZoom{ from{ transform:scale(1); } to{ transform:scale(1.014); } }

  @media (prefers-reduced-motion:reduce){
    .play .lay, .play .stack{ animation:none !important; transform:none !important; opacity:1 !important; }
    .play{ animation:softIn .3s ease both; }
    @keyframes softIn{ from{ opacity:0; } to{ opacity:1; } }
  }
  .lnk{ position:absolute; left:0; top:0; right:0; bottom:0; z-index:9; display:block; }
</style>
</head>
