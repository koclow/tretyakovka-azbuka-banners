<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>L-board · Азбука вкуса × Третьяковская галерея</title>
<style>
  :root{
    --green:#184936;
    --ease-out:cubic-bezier(.16,1,.3,1);
    --ease-calm:cubic-bezier(.37,0,.63,1);
  }
  html,body{ margin:0; background:#111; }
  .stage{ position:relative; width:1920px; height:1080px; background:var(--green); overflow:hidden; }
  .lay{ position:absolute; }
  .lay img{ display:block; width:100%; height:auto; }

  /* геометрия по макету 2037:987 (px кадра 1920×1080) */
  .horse { left:718px;  top:762px; width:451.5px; }
  .disc  { left:1169px; top:595px; width:357px; }
  .couple{ left:1633px; top:741px; width:190px; }
  .badge { left:104px;  top:108px; width:316.5px; }
  .h     { left:106px;  width:307.5px; aspect-ratio:308/171; }
  .h img { height:100%; }
  .sub   { left:105px;  top:395px; width:462px; }
  .logo  { left:104px;  top:825px; width:385px; }

  /* до старта всё спрятано */
  .js .stage:not(.play) .lay{ opacity:0; }

  /* ВХОД — язык утверждённых билбордов */
  .play .horse  { animation:riseUp  1.6s var(--ease-out) 0s    both; }
  .play .disc   { animation:discIn  1.7s var(--ease-out) .12s  both; }
  .play .couple { animation:riseUp  1.5s var(--ease-out) .26s  both; }
  .play .badge  { animation:smearIn 1.1s var(--ease-out) .50s  both; }
  .play .h1     { animation:smearIn 1.2s var(--ease-out) .70s  both; }
  .play .h2     { animation:smearIn 1.2s var(--ease-out) .86s  both; }
  .play .h3     { animation:smearIn 1.2s var(--ease-out) 1.02s both; }
  .play .sub    { animation:softIn  1.2s var(--ease-out) 1.30s both; }
  .play .logo   { animation:smearIn 1.1s var(--ease-out) 1.60s both; }
  @keyframes riseUp { from{ opacity:0; transform:translateY(28px); } to{ opacity:1; transform:none; } }
  @keyframes discIn { from{ opacity:0; transform:translateY(20px) scale(.98); } to{ opacity:1; transform:none; } }
  @keyframes smearIn{ from{ opacity:0; transform:translateX(-16px) scaleX(1.03); filter:blur(6px); }
                      to  { opacity:1; transform:none; filter:blur(0); } }
  @keyframes softIn { from{ opacity:0; transform:translateX(-10px); filter:blur(4px); }
                      to  { opacity:1; transform:none; filter:blur(0); } }

  /* ПОКОЙ — вариант A «значок на лацкане»: три иллюстрации медленно качаются вокруг своего центра.
     Керфреймы 0 → +A → 0 → −A → 0, между точками ease-in-out: на краях полная остановка
     и мягкий старт обратно, без разворотов «на скорости». Периоды и направления разные — не синхронно. */
  .vA .lay img, .vC .lay img{ transform-origin:50% 50%; }
  .vA .horse  img, .vC .horse  img{ animation:swingR 11s   ease-in-out 2.8s infinite both; }
  .vA .disc   img, .vC .disc   img{ animation:swingL 9.5s  ease-in-out 3.0s infinite both; }
  .vA .couple img, .vC .couple img{ animation:swingW 13s   ease-in-out 3.2s infinite both; }
  @keyframes swingR { 0%{ transform:rotate(0deg); }  25%{ transform:rotate(6deg); }
                      50%{ transform:rotate(0deg); } 75%{ transform:rotate(-6deg); }
                      100%{ transform:rotate(0deg); } }
  @keyframes swingL { 0%{ transform:rotate(0deg); }  25%{ transform:rotate(-5deg); }
                      50%{ transform:rotate(0deg); } 75%{ transform:rotate(5deg); }
                      100%{ transform:rotate(0deg); } }
  @keyframes swingW { 0%{ transform:rotate(0deg); }  25%{ transform:rotate(6.5deg); }
                      50%{ transform:rotate(0deg); } 75%{ transform:rotate(-6.5deg); }
                      100%{ transform:rotate(0deg); } }

  /* ПОКОЙ — вариант B «наезд»: каждая иллюстрация растёт от своей нижней кромки до 110 % за 17 с,
     круг идёт фронтально (только scale), пара чуть уходит вправо, конь — чуть влево. Текст стоит. */
  .art{ position:absolute; left:0; top:0; width:1920px; height:1080px; }
  .vB .lay img{ transform-origin:50% 100%; }
  .vB .horse  img{ animation:pushHorse  17s linear 2.8s both; }
  .vB .disc   img{ animation:pushDisc   17s linear 2.8s both; }
  .vB .couple img{ animation:pushCouple 17s linear 2.8s both; }
  @keyframes pushHorse { from{ transform:translateX(0) scale(1); }    to{ transform:translateX(-14px) scale(1.10); } }
  @keyframes pushDisc  { from{ transform:scale(1); }                  to{ transform:scale(1.10); } }
  @keyframes pushCouple{ from{ transform:translateX(0) scale(1); }    to{ transform:translateX(16px) scale(1.10); } }

  /* ПОКОЙ — вариант C = A + белый диагональный блик по плашке «в компании художников».
     Полоса наклонена, идёт из левого нижнего угла плашки в правый верхний; в середине разгон,
     края мягкие (cubic-bezier(.65,0,.35,1)), проход 1,6 с, два прохода — на 7-й и на 13-й секунде.
     Маска — badge.svg, поэтому блик ложится и на золотую подложку, и на текст. */
  .shine{ position:absolute; left:104px; top:108px; width:316.5px; height:43px; pointer-events:none;
          -webkit-mask:url(assets/svg/badge.svg) 0 0 / 100% 100% no-repeat; mask:url(assets/svg/badge.svg) 0 0 / 100% 100% no-repeat; }
  .shine::before{ content:""; position:absolute; left:50%; top:50%; width:150px; height:420px;
          margin-left:-75px; margin-top:-210px;
          background:linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.10) 28%,
                     rgba(255,255,255,.42) 44%, rgba(255,255,255,.70) 50%, rgba(255,255,255,.42) 56%,
                     rgba(255,255,255,.10) 72%, rgba(255,255,255,0) 100%);
          transform:rotate(-38deg) translateX(-215px); }
  /* 6 с × 2 прохода с задержкой 6,2 с → середина блика приходится на 7,0 и 13,0 с;
     сам ход занимает первые 1,6 с цикла (26,67 %) */
  .vC .shine::before{ animation:shineDiag 6s 2 both; animation-delay:6.2s; }
  @keyframes shineDiag {
    0%      { transform:rotate(-38deg) translateX(-215px); animation-timing-function:cubic-bezier(.65,0,.35,1); }
    26.67%  { transform:rotate(-38deg) translateX(215px); }
    100%    { transform:rotate(-38deg) translateX(215px); }
  }

  /* заглушки перекрытий — только для черновика на согласование (?overlay) */
  .ov{ display:none; position:absolute; color:#9aa0ad; font:600 34px/1.3 -apple-system, Inter, Helvetica, sans-serif; }
  .overlay .ov{ display:flex; align-items:center; justify-content:center; text-align:center; }
  .ov.air { left:600px; top:0; width:1320px; height:724px; background:#1c1c1e; color:#6e6e73; }
  .ov.tick{ left:96px; top:960px; width:1728px; height:84px; background:#2b2f3a; font-size:26px; justify-content:flex-start; padding-left:24px; box-sizing:border-box; }
</style>
<script>document.documentElement.className = 'js';</script>
</head>
<body>
<div class="stage" id="st">
  <div class="art">
    <div class="lay horse"><img src="assets/horse.png" alt=""></div>
    <div class="lay disc"><img src="assets/disc.png" alt=""></div>
    <div class="lay couple"><img src="assets/couple.png" alt=""></div>
  </div>
  <div class="lay badge"><img src="assets/svg/badge.svg" alt=""></div>
  <div class="lay h h1" style="top:194px"><img src="assets/svg/headline_l1.svg" alt=""></div>
  <div class="lay h h2" style="top:194px"><img src="assets/svg/headline_l2.svg" alt=""></div>
  <div class="lay h h3" style="top:194px"><img src="assets/svg/headline_l3.svg" alt=""></div>
  <div class="lay sub"><img src="assets/svg/sub.svg" alt=""></div>
  <div class="lay logo"><img src="assets/svg/logo.svg" alt=""></div>
  <div class="shine"></div>
  <div class="ov air">ЭФИР<br>здесь идёт программа</div>
  <div class="ov tick">бегущая строка РБК</div>
</div>
<script>
  var st = document.getElementById('st'), q = location.search;
  var v = (/[?&]v=([ABC])/.exec(q) || [0, 'A'])[1];
  st.classList.add('v' + v);
  if (/[?&]overlay/.test(q)) st.classList.add('overlay');
  window.lbStart = function(){ st.classList.add('play'); };
  var at = /[?&]at=(\d+)/.exec(q);
  if (at){ st.classList.add('play'); void st.offsetWidth; document.getAnimations().forEach(function(a){ a.pause(); a.currentTime = +at[1]; }); }
  else if (!/[?&]render/.test(q)) window.addEventListener('load', function(){ setTimeout(window.lbStart, 300); });
  st.addEventListener('click', function(){ st.classList.remove('play'); void st.offsetWidth; st.classList.add('play'); });
</script>
</body>
</html>
