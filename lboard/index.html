<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>L-board · Азбука вкуса × Третьяковская галерея</title>
<style>
  :root{
    --green:#184936;
    --ease-out:cubic-bezier(.16,1,.3,1);
    --ease-calm:cubic-bezier(.37,0,.63,1);
  }
  html,body{ margin:0; background:#111; }
  .stage{ position:relative; width:1920px; height:1080px; background:var(--green); overflow:hidden; }
  .lay{ position:absolute; }
  .lay img{ display:block; width:100%; height:auto; }

  /* геометрия по макету 2037:987 (px кадра 1920×1080) */
  .horse { left:718px;  top:762px; width:451.5px; }
  .disc  { left:1169px; top:595px; width:357px; }
  .couple{ left:1633px; top:741px; width:190px; }
  .badge { left:104px;  top:108px; width:316.5px; }
  .h     { left:106px;  width:307.5px; }
  .sub   { left:105px;  top:395px; width:462px; }
  .logo  { left:104px;  top:825px; width:385px; }

  /* до старта всё спрятано */
  .js .stage:not(.play) .lay{ opacity:0; }

  /* ВХОД — язык утверждённых билбордов */
  .play .horse  { animation:riseUp  1.6s var(--ease-out) 0s    both; }
  .play .disc   { animation:discIn  1.7s var(--ease-out) .12s  both; }
  .play .couple { animation:riseUp  1.5s var(--ease-out) .26s  both; }
  .play .badge  { animation:smearIn 1.1s var(--ease-out) .50s  both; }
  .play .h1     { animation:smearIn 1.2s var(--ease-out) .70s  both; }
  .play .h2     { animation:smearIn 1.2s var(--ease-out) .86s  both; }
  .play .h3     { animation:smearIn 1.2s var(--ease-out) 1.02s both; }
  .play .sub    { animation:softIn  1.2s var(--ease-out) 1.30s both; }
  .play .logo   { animation:smearIn 1.1s var(--ease-out) 1.60s both; }
  @keyframes riseUp { from{ opacity:0; transform:translateY(28px); } to{ opacity:1; transform:none; } }
  @keyframes discIn { from{ opacity:0; transform:translateY(20px) scale(.98); } to{ opacity:1; transform:none; } }
  @keyframes smearIn{ from{ opacity:0; transform:translateX(-16px) scaleX(1.03); filter:blur(6px); }
                      to  { opacity:1; transform:none; filter:blur(0); } }
  @keyframes softIn { from{ opacity:0; transform:translateX(-10px); filter:blur(4px); }
                      to  { opacity:1; transform:none; filter:blur(0); } }

  /* ПОКОЙ — вариант A «дыхание»: то же, что в билбордах */
  .vA .horse  img, .vC .horse  img{ animation:floatY  9s  var(--ease-calm) 2.8s infinite alternate; }
  .vA .disc   img, .vC .disc   img{ animation:breathe 11s var(--ease-calm) 2.8s infinite alternate; transform-origin:50% 38%; }
  .vA .couple img, .vC .couple img{ animation:sway    12s var(--ease-calm) 3.1s infinite alternate; transform-origin:50% 100%; }
  @keyframes floatY { from{ transform:translateY(0); }  to{ transform:translateY(-1.2%); } }
  @keyframes breathe{ from{ transform:scale(1); }       to{ transform:scale(1.03); } }
  @keyframes sway   { from{ transform:rotate(-.4deg); } to{ transform:rotate(.4deg); } }

  /* ПОКОЙ — вариант B «наезд»: одна медленная камера на иллюстрации, текст стоит */
  .art{ position:absolute; left:0; top:0; width:1920px; height:1080px; }
  .vB .art{ animation:zoomIn 17s linear 2.8s both; transform-origin:1250px 1080px; }
  @keyframes zoomIn { from{ transform:scale(1) translateX(0); } to{ transform:scale(1.055) translateX(-6px); } }

  /* ПОКОЙ — вариант C «дыхание + блик»: A плюс два прохода мягкого блика по логотипу */
  .shine{ position:absolute; left:104px; top:825px; width:385px; height:52px; pointer-events:none; opacity:0;
          -webkit-mask:url(assets/logo.png) 0 0 / 100% 100% no-repeat; mask:url(assets/logo.png) 0 0 / 100% 100% no-repeat; }
  .shine::before{ content:""; position:absolute; top:-40px; bottom:-40px; left:-60%; width:45%;
          background:linear-gradient(100deg, rgba(232,196,106,0) 0%, rgba(232,196,106,.85) 45%, rgba(255,246,220,.95) 50%, rgba(232,196,106,.85) 55%, rgba(232,196,106,0) 100%);
          transform:translateX(0); }
  .vC .shine{ animation:shineOn 2.2s linear 7s 2 both; animation-delay:7s; }
  .vC .shine::before{ animation:shineMove 2.2s cubic-bezier(.4,0,.2,1) 7s 2 both; }
  .vC .shine{ animation-name:shineOn; }
  @keyframes shineOn  { 0%{ opacity:0; } 15%{ opacity:1; } 85%{ opacity:1; } 100%{ opacity:0; } }
  @keyframes shineMove{ from{ transform:translateX(0); } to{ transform:translateX(380%); } }

  /* заглушки перекрытий — только для черновика на согласование (?overlay) */
  .ov{ display:none; position:absolute; color:#9aa0ad; font:600 34px/1.3 -apple-system, Inter, Helvetica, sans-serif; }
  .overlay .ov{ display:flex; align-items:center; justify-content:center; text-align:center; }
  .ov.air { left:600px; top:0; width:1320px; height:724px; background:#1c1c1e; color:#6e6e73; }
  .ov.tick{ left:96px; top:960px; width:1728px; height:84px; background:#2b2f3a; font-size:26px; justify-content:flex-start; padding-left:24px; box-sizing:border-box; }
</style>
<script>document.documentElement.className = 'js';</script>
</head>
<body>
<div class="stage" id="st">
  <div class="art">
    <div class="lay horse"><img src="assets/horse.png" alt=""></div>
    <div class="lay disc"><img src="assets/disc.png" alt=""></div>
    <div class="lay couple"><img src="assets/couple.png" alt=""></div>
  </div>
  <div class="lay badge"><img src="assets/badge.png" alt=""></div>
  <div class="lay h h1" style="top:194.0px"><img src="assets/headline_l1.png" alt=""></div>
  <div class="lay h h2" style="top:264.0px"><img src="assets/headline_l2.png" alt=""></div>
  <div class="lay h h3" style="top:322.0px"><img src="assets/headline_l3.png" alt=""></div>
  <div class="lay sub"><img src="assets/sub.png" alt=""></div>
  <div class="lay logo"><img src="assets/logo.png" alt=""></div>
  <div class="shine"></div>
  <div class="ov air">ЭФИР<br>здесь идёт программа</div>
  <div class="ov tick">бегущая строка РБК</div>
</div>
<script>
  var st = document.getElementById('st'), q = location.search;
  var v = (/[?&]v=([ABC])/.exec(q) || [0, 'A'])[1];
  st.classList.add('v' + v);
  if (/[?&]overlay/.test(q)) st.classList.add('overlay');
  window.lbStart = function(){ st.classList.add('play'); };
  var at = /[?&]at=(\d+)/.exec(q);
  if (at){ st.classList.add('play'); void st.offsetWidth; document.getAnimations().forEach(function(a){ a.pause(); a.currentTime = +at[1]; }); }
  else if (!/[?&]render/.test(q)) window.addEventListener('load', function(){ setTimeout(window.lbStart, 300); });
  st.addEventListener('click', function(){ st.classList.remove('play'); void st.offsetWidth; st.classList.add('play'); });
</script>
</body>
</html>
