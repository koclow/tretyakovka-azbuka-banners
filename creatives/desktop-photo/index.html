<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Соберите коллекцию шедевров — перетяжка 100%×250, фото</title>
<script>document.documentElement.className = 'js';</script>
<style>
  :root{
    --green:#184936;
    --ease-out:cubic-bezier(.16,1,.3,1);
    --ease-calm:cubic-bezier(.37,0,.63,1);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; background:var(--green); overflow:hidden; }
  .cr{ position:relative; width:100%; height:250px; background:var(--green); overflow:hidden;
       cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent; }
  .box{ position:absolute; left:0; right:0; top:0; height:100%; margin:0 auto; max-width:1440px;
        container-type:inline-size;
        --d:calc(100cqw - 680px); }   /* «сколько мы шире минимума» — ширина коробки, не высота */
  .lay{ position:absolute; }

  /* Макет «вар 1»: зелёная панель 58,3 % ширины, фото — остальное.
     Набор между 680 и 1440 растёт линейно; логотип на 1440 — 314 px (уменьшен в макете). */
  .headline{ left:calc(30px + var(--d) * .02895); top:calc(42px - var(--d) * .00395); width:calc(298px + var(--d) * .26118);
             aspect-ratio:496.488 / 97.544; }
  .lockup  { left:calc(30px + var(--d) * .02632); top:calc(178px + var(--d) * .00789); width:calc(217px + var(--d) * .12763);
             aspect-ratio:362 / 43.5741; }
  .photo{ position:absolute; top:0; bottom:0; right:0; left:58.333%; overflow:hidden; }
  .photo img{ display:block; width:100%; height:100%; object-fit:cover; object-position:45% 50%; }

  /* слова заголовка и части логотипа — отдельными слоями с общим viewBox */
  .w, .lk{ position:absolute; left:0; top:0; width:100%; transform-origin:0 50%; }
  .w img, .lk img{ display:block; width:100%; height:auto; }

  /* слот чуть уже 680 — макет 680 по центру, края подрезаются */
  @media (max-width:679.98px){
    .box{ left:50%; right:auto; transform:translateX(-50%); width:680px; }
  }
  /* совсем узкий (< 600) — только панель с набором */
  @media (max-width:599.98px){
    .photo{ display:none; }
    .box{ width:300px; }
    .headline{ left:24px; top:74px; width:252px; }
    .lockup  { left:24px; top:174px; width:220px; }
  }

  /* до старта слои спрятаны: никакой вспышки готового кадра перед появлением */
  .js .cr:not(.play):not(.static) > *{ opacity:0; }

  /* ——— появление: фото въезжает справа, текст и логотип — слева с мягким «смазом», слово за словом ——— */
  .play .photo{ animation:photoIn 1.8s var(--ease-out) 0s    both; }
  .play .w1   { animation:smearIn 1.2s var(--ease-out) .45s  both; }
  .play .w2   { animation:smearIn 1.2s var(--ease-out) .60s  both; }
  .play .w3   { animation:smearIn 1.2s var(--ease-out) .75s  both; }
  .play .lk1  { animation:smearIn 1.0s var(--ease-out) 1.15s both; }
  .play .lk2  { animation:smearIn 1.0s var(--ease-out) 1.27s both; }
  .play .lk3  { animation:smearIn 1.0s var(--ease-out) 1.37s both; }
  @keyframes photoIn{ from{ opacity:0; transform:translateX(14px); } to{ opacity:1; transform:none; } }
  @keyframes smearIn{ from{ opacity:0; transform:translateX(-10px) scaleX(1.03); filter:blur(4px); }
                      to  { opacity:1; transform:none; filter:blur(0); } }
  .done .lay, .done .w, .done .lk, .done .photo{ animation:none; opacity:1; transform:none; filter:none; }

  /* ——— покой: медленный наезд на коробку ——— */
  .photo img{ animation:kenburns 22s var(--ease-calm) 0s infinite alternate; transform-origin:55% 50%; }
  @keyframes kenburns{ from{ transform:scale(1.06); } to{ transform:scale(1); } }

  @media (prefers-reduced-motion:reduce){
    .play .lay, .play .w, .play .lk, .play .photo, .photo img{
      animation:none !important; transform:none !important; opacity:1 !important; filter:none !important; }
    .play{ animation:softIn .4s ease both; }
    @keyframes softIn{ from{ opacity:0; } to{ opacity:1; } }
  }
</style>
</head>
<body>
<div class="cr" id="cr" role="img" aria-label="Азбука вкуса и Третьяковская галерея. Соберите коллекцию шедевров">
  <div class="box">
    <div class="photo"><img src="assets/photo.jpg" alt=""></div>
    <div class="lay headline">
      <div class="w w1"><img src="assets/w1.svg" alt=""></div>
      <div class="w w2"><img src="assets/w2.svg" alt=""></div>
      <div class="w w3"><img src="assets/w3.svg" alt=""></div>
    </div>
    <div class="lay lockup">
      <div class="lk lk1"><img src="assets/lk1.svg" alt=""></div>
      <div class="lk lk2"><img src="assets/lk2.svg" alt=""></div>
      <div class="lk lk3"><img src="assets/lk3.svg" alt=""></div>
    </div>
  </div>
</div>
<script>
  var c = document.getElementById('cr'), started = false, q = location.search, doneT;
  function start(){
    if (started) return; started = true;
    c.classList.remove('done'); c.classList.add('play');
    doneT = setTimeout(function(){ c.classList.add('done'); }, 3200);
  }
  function go(){
    if (!document.hidden) return start();
    document.addEventListener('visibilitychange', function h(){
      if (!document.hidden){ document.removeEventListener('visibilitychange', h); start(); }
    });
  }
  var at = /[?&]at=(\d+)/.exec(q);
  if (at){
    start(); clearTimeout(doneT); void c.offsetWidth;
    document.getAnimations().forEach(function(a){ a.pause(); a.currentTime = +at[1]; });
  }
  else if (/[?&]static/.test(q)){ c.classList.add('static'); started = true; }
  else {
    if (document.readyState === 'complete') go(); else window.addEventListener('load', go);
    setTimeout(go, 2500);
  }
  c.addEventListener('click', function(){
    clearTimeout(doneT); started = false;
    c.classList.remove('play', 'done'); void c.offsetWidth; start();
  });
</script>
</body>
</html>
