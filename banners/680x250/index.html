<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Соберите коллекцию шедевров — 680×250</title>
<style>
  :root{
    --green:#184936;
    --ease-out:cubic-bezier(.23,1,.32,1);   /* сильный ease-out: быстрый старт, мягкая посадка */
    --ease-calm:cubic-bezier(.37,0,.63,1);  /* синусоида для бесконечного покоя */
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; background:var(--green); overflow:hidden; }

  /* Баннер тянется по ширине контейнера, пропорции держит aspect-ratio.
     Ассеты @3x — до 2040px остаётся резким. */
  .banner{
    position:relative; width:100%; aspect-ratio:680/250;
    background:var(--green); overflow:hidden;
    cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent;
  }
  .lay{ position:absolute; }
  .lay > img{ display:block; width:100%; height:100%; }

  /* ——— геометрия: проценты = точная копия макета 680×250 ——— */
  .art    { position:absolute; left:36.3235%; top:0; width:62.549%; height:100%; }
  .horse  { left:0%;       top:40.2668%; width:47.8056%; height:59.7332%; }
  .disc   { left:35.9718%; top:0;        width:43.0251%; height:59.2%;
            transform-origin:50% 38.1757%; }   /* центр круга, не центр рамки */
  .couple { left:77.4294%; top:25.6%;    width:22.5706%; height:74.4%; }

  .badge  { left:3.3824%; top:12%;      width:31.7647%; height:10%; }
  .h1     { left:3.4804%; top:24%;      width:39.9019%; height:10.5332%; }
  .h2     { left:3.5784%; top:36.5332%; width:18.7254%; height:8.4%; }
  .logo   { left:3.3824%; top:72%;      width:18.0882%; height:16%; }

  /* ——— появление: всё на месте к 1.1 с ——— */
  .play .horse { animation:slideIn .72s var(--ease-out) .10s both; }
  .play .disc  { animation:popIn   .66s var(--ease-out) .20s both; }
  .play .couple{ animation:slideIn .66s var(--ease-out) .30s both; }
  .play .badge { animation:riseIn  .50s var(--ease-out) .14s both; }
  .play .h1    { animation:riseIn  .56s var(--ease-out) .24s both; }
  .play .h2    { animation:riseIn  .56s var(--ease-out) .31s both; }
  .play .logo  { animation:riseIn  .60s var(--ease-out) .50s both; }

  /* сдвиги заданы в процентах от самого слоя — масштабируются вместе с баннером */
  @keyframes slideIn{ from{ opacity:0; transform:translateX(22%); } to{ opacity:1; transform:none; } }
  @keyframes popIn  { from{ opacity:0; transform:scale(.94);      } to{ opacity:1; transform:scale(1); } }
  @keyframes riseIn { from{ opacity:0; transform:translateY(40%); } to{ opacity:1; transform:none; } }

  /* ——— покой: живёт только иллюстрация, набор стоит неподвижно ——— */
  .horse  img{ animation:floatY  5.5s var(--ease-calm) 1.6s infinite alternate; }
  .disc   img{ animation:breathe 6.5s var(--ease-calm) 1.6s infinite alternate;
               transform-origin:50% 38.1757%; }
  .couple img{ animation:sway    7.5s var(--ease-calm) 1.8s infinite alternate;
               transform-origin:50% 100%; }

  @keyframes floatY { from{ transform:translateY(0); }     to{ transform:translateY(-1.674%); } }
  @keyframes breathe{ from{ transform:scale(1); }          to{ transform:scale(1.035); } }
  @keyframes sway   { from{ transform:rotate(-.55deg); }   to{ transform:rotate(.55deg); } }

  /* Меньше движения — не «ноль движения»: один спокойный проявляющийся кадр. */
  @media (prefers-reduced-motion:reduce){
    .play .lay, .lay img{ animation:none !important; transform:none !important; opacity:1 !important; }
    .play{ animation:softIn .3s ease both; }
    @keyframes softIn{ from{ opacity:0; } to{ opacity:1; } }
  }
</style>
</head>
<body>
<div class="banner play" id="banner" role="img"
     aria-label="Азбука вкуса. В компании художников: соберите коллекцию шедевров">
  <div class="art">
    <div class="lay horse"><img src="assets/horse.png" alt=""></div>
    <div class="lay disc"><img src="assets/disc.png" alt=""></div>
    <div class="lay couple"><img src="assets/couple.png" alt=""></div>
  </div>
  <div class="lay badge"><img src="assets/badge.png" alt=""></div>
  <div class="lay h1"><img src="assets/h1.png" alt=""></div>
  <div class="lay h2"><img src="assets/h2.png" alt=""></div>
  <div class="lay logo"><img src="assets/logo.png" alt=""></div>
</div>
<script>
  var b = document.getElementById('banner');

  // клик — проиграть появление заново
  b.addEventListener('click', function(){
    b.classList.remove('play');
    void b.offsetWidth;
    b.classList.add('play');
  });
</script>
</body>
</html>
