<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Соберите коллекцию шедевров — мобильный 300×250, мужчина</title>
<style>
  :root{ --green:#184936; --ease-out:cubic-bezier(.16,1,.3,1); --ease-calm:cubic-bezier(.37,0,.63,1); }
  *{ margin:0; padding:0; box-sizing:border-box; }
  /* Креатив 300×250 по ТТ. Если слот шире (мобильный 100%×250), баннер стоит по центру,
     а поля заливаются его фоновым цветом — так и написано в требованиях РБК. */
  html,body{ width:100%; height:100%; background:var(--green); overflow:hidden; }
  .banner{ position:relative; width:300px; height:250px; margin:0 auto; background:var(--green); overflow:hidden;
           cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent; }
  /* Макет «4»: фото сверху 300×125, снизу зелёная панель с набором */
  .photo{ position:absolute; left:0; top:0; width:300px; height:125px; overflow:hidden; transform-origin:50% 50%; }
  .photo img{ display:block; width:100%; height:100%; object-fit:cover; object-position:50% 40%; }
  .box{ position:absolute; left:0; top:125px; width:300px; height:125px; }
  .lay{ position:absolute; }
  .headline{ left:18px; top:16px; width:248px; aspect-ratio:248.244 / 46.272; }
  .lockup  { left:18px; top:84px; width:264px; aspect-ratio:264 / 31.5224; }
  .w, .lk{ position:absolute; left:0; top:0; width:100%; transform-origin:0 50%; }
  .w img, .lk img{ display:block; width:100%; height:auto; }

  /* ——— появление: фото проявляется, слова въезжают слева со «смазом», логотип следом ——— */
  .play .photo{ animation:photoIn 1.5s var(--ease-out) 0s    both; }
  .play .w1   { animation:smearIn 1.1s var(--ease-out) .40s  both; }
  .play .w2   { animation:smearIn 1.1s var(--ease-out) .54s  both; }
  .play .w3   { animation:smearIn 1.1s var(--ease-out) .68s  both; }
  .play .lk1  { animation:smearIn .9s  var(--ease-out) 1.05s both; }
  .play .lk2  { animation:smearIn .9s  var(--ease-out) 1.15s both; }
  .play .lk3  { animation:smearIn .9s  var(--ease-out) 1.25s both; }
  @keyframes photoIn{ from{ opacity:0; transform:scale(1.03); } to{ opacity:1; transform:none; } }
  @keyframes smearIn{ from{ opacity:0; transform:translateX(-12px) scaleX(1.08); filter:blur(5px); }
                      to  { opacity:1; transform:none; filter:blur(0); } }
  /* ——— покой: медленный наезд на фото ——— */
  .photo img{ animation:kenburns 20s var(--ease-calm) 0s infinite alternate; transform-origin:50% 45%; }
  @keyframes kenburns{ from{ transform:scale(1.07); } to{ transform:scale(1); } }

  @media (prefers-reduced-motion:reduce){
    .play .lay, .play .w, .play .lk, .play .photo, .photo img{
      animation:none !important; transform:none !important; opacity:1 !important; filter:none !important; }
    .play{ animation:softIn .4s ease both; }
    @keyframes softIn{ from{ opacity:0; } to{ opacity:1; } }
  }
</style>
</head>
<body>
<div class="banner" id="banner" role="img" aria-label="Азбука вкуса и Третьяковская галерея. Соберите коллекцию шедевров">
  <div class="photo"><img src="assets/photo.jpg" alt=""></div>
  <div class="box">
    <div class="lay headline">
      <div class="w w1"><img src="assets/w1.svg" alt=""></div>
      <div class="w w2"><img src="assets/w2.svg" alt=""></div>
      <div class="w w3"><img src="assets/w3.svg" alt=""></div>
    </div>
    <div class="lay lockup">
      <div class="lk lk1"><img src="assets/lk1.svg" alt=""></div>
      <div class="lk lk2"><img src="assets/lk2.svg" alt=""></div>
      <div class="lk lk3"><img src="assets/lk3.svg" alt=""></div>
    </div>
  </div>
</div>
<script>
  var b = document.getElementById('banner'), started = false, q = location.search;
  function start(){ if (started) return; started = true; b.classList.add('play'); }
  var at = /[?&]at=(\d+)/.exec(q);
  if (at){
    // ?at=1200 — стоп-кадр на заданной миллисекунде: для раскадровки и проверки
    start(); void b.offsetWidth;
    document.getAnimations().forEach(function(a){ a.pause(); a.currentTime = +at[1]; });
  }
  else if (/[?&]static/.test(q)){ started = true; }   // финальный кадр без появления: скриншоты, заглушка
  else if ('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(e){ if (e[0].isIntersecting){ start(); io.disconnect(); } }, { threshold:.5 });
    io.observe(b);
    document.addEventListener('visibilitychange', function(){ if (!document.hidden) start(); });
    setTimeout(start, 1500);
  } else { start(); }
  b.addEventListener('click', function(){ b.classList.remove('play'); void b.offsetWidth; b.classList.add('play'); });
</script>
</body>
</html>
