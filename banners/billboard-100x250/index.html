<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Соберите коллекцию шедевров — билборд 100%×250, иллюстрация</title>
<style>
  :root{
    --green:#184936;
    --ease-out:cubic-bezier(.16,1,.3,1);      /* мягкий длинный выход — премиальный темп */
    --ease-calm:cubic-bezier(.37,0,.63,1);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; background:var(--green); overflow:hidden; }
  .banner{ position:relative; width:100%; height:250px; background:var(--green); overflow:hidden;
           cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent; }
  .box{ position:absolute; left:0; right:0; top:0; height:100%; margin:0 auto; max-width:1440px;
        container-type:inline-size;
        --d:calc(100cqw - 680px); }   /* «сколько мы шире минимума» — ширина коробки, не высота */
  .lay{ position:absolute; }
  .lay > img{ display:block; width:100%; height:auto; }

  /* Два опорных макета: 680×250 (минимум и заглушка) и 1440×250 («вар 2»).
     Между ними всё линейно: left = L680 + (ширина − 680) · k. */
  .badge   { left:calc(23px + var(--d) * .02237); top:calc(30px - var(--d) * .00526); width:216px; }
  .headline{ left:calc(24px + var(--d) * .02329); top:calc(60px + var(--d) * .01066); width:272px; }
  .logo-st { left:calc(23px + var(--d) * .02237); top:calc(180px + var(--d) * .01316); width:123px; }
  .logo-ln { left:calc(23px + var(--d) * .02237); top:calc(180px + var(--d) * .01316); width:267px; height:40px; display:none; }
  .logo-ln .mark{ position:absolute; left:0; top:0; width:48.4px; }
  .logo-ln .word{ position:absolute; left:62.1px; top:4px; width:204.9px; }

  .horse { left:calc(247px + var(--d) * .51447);     top:calc(100.667px - var(--d) * .10351); width:calc(203.333px + var(--d) * .17561); }
  .disc  { left:calc(400px + var(--d) * .75658);     top:calc(0px - var(--d) * .01197);       width:calc(183px + var(--d) * .10961);
           transform-origin:50% 38.2%; }
  .couple{ left:calc(576.333px + var(--d) * .9114);  top:calc(64px - var(--d) * .06316);      width:calc(96px + var(--d) * .06); }

  /* заголовок растёт только после 960 px — иначе к 800 px упирается в голову коня */
  @media (min-width:960px){ .headline{ width:calc(272px + (100cqw - 960px) * .46771); } }
  /* логотип: до 900 px — макетный, в две строки; дальше — в строку, как в макете 1440 */
  @media (min-width:900px){ .logo-st{ display:none; } .logo-ln{ display:block; } }

  /* ——— узкий слот (< 680): только набор, по центру ——— */
  .m{ display:none; }
  @media (max-width:679.98px){
    .wide{ display:none; }
    .m{ display:block; }
    .box{ left:50%; right:auto; transform:translateX(-50%); width:300px; }
    .m.headline{ left:24px; top:74px; width:252px; }
    .m.logo-st { left:24px; top:174px; width:123px; }
  }

  /* ——— появление: неспешно, слоями, всё на месте к ~2,3 с ——— */
  .play .horse   { animation:driftIn 1.4s var(--ease-out) .10s both; }
  .play .disc    { animation:discIn  1.5s var(--ease-out) .40s both; }
  .play .couple  { animation:driftIn 1.3s var(--ease-out) .65s both; }
  .play .badge   { animation:riseIn  1.0s var(--ease-out) .25s both; }
  .play .headline{ animation:wipeIn  1.5s var(--ease-out) .50s both; }
  .play .logo-st, .play .logo-ln{ animation:riseIn 1.1s var(--ease-out) 1.25s both; }

  @keyframes driftIn{ from{ opacity:0; transform:translateX(9%); } to{ opacity:1; transform:none; } }
  @keyframes discIn { from{ opacity:0; transform:scale(.92) rotate(-4deg); } to{ opacity:1; transform:none; } }
  @keyframes riseIn { from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:none; } }
  @keyframes wipeIn { from{ opacity:0; clip-path:inset(0 100% 0 0); transform:translateY(8px); }
                      to  { opacity:1; clip-path:inset(0 0 0 0);    transform:none; } }

  /* ——— покой: едва заметно и очень медленно ——— */
  .horse  img{ animation:floatY  9s  var(--ease-calm) 2.6s infinite alternate; }
  .disc   img{ animation:breathe 11s var(--ease-calm) 2.6s infinite alternate; transform-origin:50% 38.2%; }
  .couple img{ animation:sway    12s var(--ease-calm) 2.9s infinite alternate; transform-origin:50% 100%; }
  @keyframes floatY { from{ transform:translateY(0); }   to{ transform:translateY(-1.4%); } }
  @keyframes breathe{ from{ transform:scale(1); }        to{ transform:scale(1.03); } }
  @keyframes sway   { from{ transform:rotate(-.4deg); }  to{ transform:rotate(.4deg); } }

  @media (prefers-reduced-motion:reduce){
    .play .lay, .lay img{ animation:none !important; transform:none !important; opacity:1 !important; clip-path:none !important; }
    .play{ animation:softIn .4s ease both; }
    @keyframes softIn{ from{ opacity:0; } to{ opacity:1; } }
  }
</style>
</head>
<body>
<div class="banner" id="banner" role="img" aria-label="Азбука вкуса. В компании художников: соберите коллекцию шедевров">
  <div class="box">
    <div class="lay wide horse"><img src="assets/horse.png" alt=""></div>
    <div class="lay wide disc"><img src="assets/disc.png" alt=""></div>
    <div class="lay wide couple"><img src="assets/couple.png" alt=""></div>
    <div class="lay wide badge"><img src="assets/badge.png" alt=""></div>
    <div class="lay wide headline"><img src="assets/headline.svg" alt=""></div>
    <div class="lay wide logo-st"><img src="assets/logo.png" alt=""></div>
    <div class="lay wide logo-ln"><img class="mark" src="assets/logo-mark.svg" alt=""><img class="word" src="assets/logo-word.svg" alt=""></div>
    <div class="lay m headline"><img src="assets/headline.svg" alt=""></div>
    <div class="lay m logo-st"><img src="assets/logo.png" alt=""></div>
  </div>
</div>
<script>
  var b = document.getElementById('banner'), started = false;
  function start(){ if (started) return; started = true; b.classList.add('play'); }
  // ?static — финальный кадр без появления: для скриншотов и заглушки
  if (/[?&]static/.test(location.search)){ started = true; }
  else if ('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(e){ if (e[0].isIntersecting){ start(); io.disconnect(); } }, { threshold:.5 });
    io.observe(b);
    document.addEventListener('visibilitychange', function(){ if (!document.hidden) start(); });
    setTimeout(start, 1500);
  } else { start(); }
  b.addEventListener('click', function(){ b.classList.remove('play'); void b.offsetWidth; b.classList.add('play'); });
</script>
</body>
</html>
